name: Test and publish latest ASIN Pulse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asin-pulse-release
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 scripts/package.py
      - name: Test packaged extension in Chromium
        run: |
          npx playwright install --with-deps chromium
          unzip -q artifacts/ASIN-Pulse.zip -d artifacts/browser-package
          node test/extension-smoke.cjs artifacts/browser-package/extension
          rm -rf artifacts/browser-package
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: artifacts/
  windows-installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts
      - name: Exercise the actual Windows installer
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "ASIN Pulse test – O'Brien"
          $env:ASIN_PULSE_SETUP_NO_LAUNCH = '1'
          Expand-Archive artifacts/ASIN-Pulse.zip package
          cmd /c package\ASIN-Pulse-Setup.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'ASINPulse/extension/manifest.json'
          if (!(Test-Path $installed)) { throw 'No installed extension' }
          # Updating a second time must preserve the path and keep a rollback copy.
          cmd /c package\ASIN-Pulse-Setup.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Update failed' }
          if (!(Test-Path (Join-Path $env:LOCALAPPDATA 'ASINPulse/extension-backup/manifest.json'))) { throw 'No rollback copy' }
          $shell = New-Object -ComObject WScript.Shell
          $desktop = [Environment]::GetFolderPath('Desktop')
          $open = $shell.CreateShortcut((Join-Path $desktop 'ASIN Pulse.lnk'))
          $update = $shell.CreateShortcut((Join-Path $desktop 'Update ASIN Pulse.lnk'))
          if (!(Test-Path $open.TargetPath)) { throw 'Chrome shortcut target missing' }
          if ($open.Arguments -ne '--app=chrome-extension://ehkddogepoedojmgkldikiemlcdnmkna/sourcing.html') { throw 'Wrong app shortcut' }
          if ($update.TargetPath -ne (Join-Path $env:LOCALAPPDATA 'ASINPulse/ASIN-Pulse-Setup.cmd')) { throw 'Wrong update shortcut' }
          if (!(Test-Path $update.TargetPath)) { throw 'Updater shortcut target missing' }
      - name: Test installed extension in real Windows Chromium
        shell: pwsh
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          node test/extension-smoke.cjs (Join-Path $env:RUNNER_TEMP "ASIN Pulse test – O'Brien/ASINPulse/extension")
          if ($LASTEXITCODE -ne 0) { throw 'Windows extension test failed' }
  publish:
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts
      - name: Publish latest tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            echo "A newer update is being tested; this older build will not replace Latest."
            exit 0
          fi
          VERSION=$(node -p "require('./manifest.json').version")
          gh release create "build-${GITHUB_RUN_NUMBER}" artifacts/ASIN-Pulse.zip artifacts/ASIN-Pulse.zip.sha256 artifacts/ASIN-Pulse-Setup.cmd --target "$GITHUB_SHA" --title "ASIN Pulse ${VERSION} — build ${GITHUB_RUN_NUMBER}" --notes "Latest tested build. New users: download ASIN-Pulse-Setup.cmd and run it. Existing users: double-click Update ASIN Pulse on your desktop. Finish or pause a scan before updating. If this repository is private, download ASIN-Pulse.zip while signed in, extract it, and run the included setup." --latest
